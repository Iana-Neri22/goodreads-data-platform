[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*"]

[project]
name = "goodreads-data-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["duckdb==1.5.2", "pydantic-settings>=2.0"]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.45.0",
    "plotly>=6.0.0",
]
prefect = [
    "prefect>=3.0",
]
dev = [
    "pytest==9.0.3",
    "pytest-cov==6.1.0",
    "ruff==0.11.10",
    "mypy==1.10.0",
    "pre-commit==4.2.0",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=ingestion --cov-report=term-missing --cov-fail-under=100"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "G",    # flake8-logging-format
    "PERF", # perflint
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "ERA",  # eradicate
    "T20",  # flake8-print
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["ingestion"]
